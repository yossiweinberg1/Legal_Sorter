# === Legal Sorter Configuration 3fe332643c81719059d969cea99d33c83707ca5d===
pull_folder: "C:/LegalSorter/pull"
index_folder: "C:/LegalSorter/index"
pending_folder: "C:/LegalSorter/pending"

keep_if_no_repull_source: true

courtlistener:
  base_url: "https://www.courtlistener.com/api/rest/v4"
  api_tokens: []
# Use specific case names to avoid huge search results
seed_cases:
  - "State v. Roman-Navarre"
  - "State v. Mallozzi"
  - "State v. Roman-Lopez"

# === LLM / AI Assistant ===
# Supports any OpenAI-compatible endpoint (OpenAI, Ollama, LM Studio, etc.)
# IMPORTANT: Never put real API keys here. Use the LLM_API_KEY environment variable.
#   Windows:  setx LLM_API_KEY "sk-..."
#   Linux/Mac: export LLM_API_KEY="sk-..."
# Ollama (local, free):
#   base_url: "http://localhost:11434/v1"
#   api_key:  ""          (leave blank or set to "ollama")
#   model:    "llama3"    (after: ollama pull llama3)
llm:
  base_url: "https://api.openai.com/v1"
  api_key: ""             # override with LLM_API_KEY env var
  model: "gpt-4o-mini"
  fast_model: "gpt-4o-mini"
  accurate_model: "gpt-4o-mini"
  max_context_chars: 12000  # chars of case text sent per RAG query
  require_citations: true
  min_sources: 1
  timeout_seconds: 60

# === Structured Hierarchical ID (Barcode) ===
# Every ingested document gets a structured ID of the form:
#   LS-{CT}-{JR}-{SM}-{YR}-{SQ}
# e.g. LS-CA-CA9-CIV-2019-000042  (9th Cir. / civil rights / 2019)
#
# strategy options:
#   "rules"             Pure regex/gazetteer — fast, always available, no LLM.
#   "llm"               Ask the fast LLM model — richer subject classification.
#   "llm_with_fallback" Try LLM first, fall back to rules on any error (default).
#
# llm_model / llm_base_url override the main LLM settings for barcode generation.
# Leave blank to reuse the main llm.fast_model / llm.base_url.
# llm_timeout_seconds: how long to wait for the classification call (default 20s).
barcode:
  enabled: true
  strategy: "llm_with_fallback"
  llm_model: ""          # e.g. "llama3" or "mistral" for a local Ollama model
  llm_base_url: ""       # e.g. "http://localhost:11434/v1"  (blank = use llm.base_url)
  llm_timeout_seconds: 20
  confirm_threshold: 0.85  # auto-set barcode_confirmed=1 when confidence >= this

auth:
  enabled: false
  api_keys: []

production:
  enabled: false
  support_email: ""
  backup_folder: ""
  audit_log_path: "logs/audit.log"
  quarantine_folder: "quarantine"
  retention_days: 365
  telemetry_enabled: false
  quality_gate:
    citation_f1_min: 0.70
    entity_f1_min: 0.60
    min_cases: 1
    baseline_file: "tests/fixtures/gold_baseline.json"